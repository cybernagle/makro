  <!-- tools -> tmux interface leak note (RESOLVED) -->
  <g filter="url(#shadow)">
    <rect x="720" y="440" width="510" height="100" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="735" y="462" class="issue" fill="#047857">✓ 已解决：TmuxClient 接口不再泄漏 tmux 结构体类型</text>
    <text x="735" y="480" class="pkg-role">tools.TmuxClient.State() *tmux.StateMirror → HasSession(name) bool。</text>
    <text x="735" y="496" class="pkg-role">types.go 不再 import tmux（仅 tools 业务文件用 tmux.XxxCmd 命令字典，</text>
    <text x="735" y="514" class="pkg-role">那是合理的消费关系，非分层违规）。tmux.Client 加 HasSession 实现。</text>
    <text x="735" y="531" class="pkg-role">依赖反转（DIP）完成：抽象不依赖细节。</text>
  </g>

