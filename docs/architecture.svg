<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Palette -->
    <style>
      .title    { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .layer-label { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 1.5px; }
      .pkg-name  { font-size: 15px; font-weight: 700; }
      .pkg-role  { font-size: 11px; fill: #475569; }
      .pkg-file  { font-size: 10px; fill: #94a3b8; }
      .edge-label{ font-size: 10px; fill: #475569; }
      .legend    { font-size: 11px; fill: #334155; }
      .issue     { font-size: 10.5px; fill: #b91c1c; font-weight: 600; }
      .badge     { font-size: 9.5px; fill: #fff; font-weight: 700; }
    </style>

    <!-- Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>

    <!-- Node base styles -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ── Title ── -->
  <text x="40" y="42" class="title">Makro — 分层架构 (Layered Architecture) · 重构后</text>
  <text x="40" y="64" class="subtitle">依赖方向：自上而下，上层依赖下层。同层之间通过接口解耦。三条历史耦合（brain→agent / tools→tmux / GUI→tmux）已全部消除 ✓</text>

  <!-- Layer band backgrounds -->
  <rect x="24"  y="84"  width="1232" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="24"  y="222" width="1232" height="168" rx="10" fill="#eff6ff" stroke="#dbeafe"/>
  <rect x="24"  y="410" width="1232" height="150" rx="10" fill="#ecfdf5" stroke="#d1fae5"/>
  <rect x="24"  y="586" width="1232" height="128" rx="10" fill="#f5f3ff" stroke="#ede9fe"/>
  <rect x="24"  y="734" width="1232" height="118" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <rect x="24"  y="872" width="1232" height="82"  rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>

  <!-- ── Layer labels (left gutter) ── -->
  <text x="40" y="104" class="layer-label">PRESENTATION / ENTRY  (main + TUI + GUI + iOS)</text>
  <text x="40" y="242" class="layer-label">APPLICATION  (Agent Orchestrator + Brain)</text>
  <text x="40" y="430" class="layer-label">DOMAIN TOOLS  (Tools + Skills + Hooks + Guardian)</text>
  <text x="40" y="606" class="layer-label">PROVIDERS / ADAPTERS  (LLM · Tmux · Notify · APNs)</text>
  <text x="40" y="754" class="layer-label">INFRASTRUCTURE  (Config · Usage Store · Memory Client)</text>
  <text x="40" y="892" class="layer-label">SHARED KERNEL  (util)</text>

  <!-- ════════════ LAYER 1: Presentation ════════════ -->
  <!-- main.go -->
  <g filter="url(#shadow)">
    <rect x="48" y="114" width="150" height="76" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="48" y="114" width="150" height="6" rx="3" fill="#0f172a"/>
