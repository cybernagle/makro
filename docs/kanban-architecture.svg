<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
  <title>Makro Kanban Task Architecture</title>
  <desc>A task card = kind (how / who acts) × direction (why it exists) × state (where it is). kind splits into permanent, graduating, none, and hint-only.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A8A29E"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1240" height="860" fill="#FAFAF9"/>

  <!-- ===== HEADER ===== -->
  <text x="40" y="48" font-size="25" font-weight="700" fill="#1C1917">Makro · Kanban Task Architecture</text>
  <text x="40" y="72" font-size="13" fill="#57534E">a task card = kind (how / who acts)  ×  direction (why it exists)  ×  state (where it is)</text>
  <text x="1208" y="44" font-size="11" fill="#78716C" text-anchor="end">agent never sees the board  ·  makro reads signals + birth-kind → indicator</text>
  <text x="1208" y="62" font-size="11" fill="#78716C" text-anchor="end">runtime events only escalate, never define  ·  “done” is human-committed</text>
  <line x1="40" y1="92" x2="1208" y2="92" stroke="#E7E5E4"/>

  <!-- ===== LEGEND ===== -->
  <rect x="32" y="108" width="300" height="512" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
  <text x="48" y="136" font-size="15" font-weight="700" fill="#1C1917">kind · human-loop need</text>
  <text x="48" y="154" font-size="11" fill="#78716C">how the work gets done — and who must act</text>

  <!-- PERMANENT -->
  <text x="48" y="178" font-size="10" font-weight="700" fill="#C2410C" letter-spacing="0.5">PERMANENT  ·  capability-independent</text>
  <rect x="48" y="182" width="256" height="1" fill="#F5D6C5"/>

  <!-- physical-action -->
  <rect x="48" y="190" width="60" height="17" rx="4.5" fill="#FED7AA" stroke="#C2410C"/>
  <text x="78" y="202" font-size="9.5" font-weight="600" fill="#7C2D12" text-anchor="middle">physical</text>
  <text x="118" y="202" font-size="11.5" font-weight="600" fill="#1C1917">physical-action</text>
  <text x="48" y="220" font-size="10" fill="#78716C">manual operation in the real world / external system</text>

  <!-- real-world-verify -->
  <rect x="48" y="234" width="49" height="17" rx="4.5" fill="#FED7AA" stroke="#C2410C"/>
  <text x="72.5" y="246" font-size="9.5" font-weight="600" fill="#7C2D12" text-anchor="middle">verify</text>
  <text x="107" y="246" font-size="11.5" font-weight="600" fill="#1C1917">real-world-verify</text>
  <text x="48" y="264" font-size="10" fill="#78716C">verify an outcome the agent can’t perceive</text>

  <!-- irreversible-commitment -->
  <rect x="48" y="278" width="83" height="17" rx="4.5" fill="#FED7AA" stroke="#C2410C"/>
  <text x="89.5" y="290" font-size="9.5" font-weight="600" fill="#7C2D12" text-anchor="middle">irreversible</text>
  <text x="141" y="290" font-size="11.5" font-weight="600" fill="#1C1917">irreversible-commitment</text>
  <text x="48" y="308" font-size="10" fill="#78716C">outward &amp; irreversible; human owns the consequence</text>

  <!-- GRADUATING -->
  <text x="48" y="346" font-size="10" font-weight="700" fill="#1D4ED8" letter-spacing="0.5">GRADUATING  ·  capability-gap (will hand out)</text>
  <rect x="48" y="350" width="256" height="1" fill="#CFE0FB"/>

  <!-- business-judgment -->
  <rect x="48" y="358" width="83" height="17" rx="4.5" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="89.5" y="370" font-size="9.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">biz-judgment</text>
  <text x="141" y="370" font-size="11.5" font-weight="600" fill="#1C1917">business-judgment</text>
  <text x="48" y="388" font-size="10" fill="#78716C">a decision only the human can / should make</text>

  <!-- cross-context-review -->
  <rect x="48" y="402" width="49" height="17" rx="4.5" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="72.5" y="414" font-size="9.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">review</text>
  <text x="107" y="414" font-size="11.5" font-weight="600" fill="#1C1917">cross-context-review</text>
  <text x="48" y="432" font-size="10" fill="#78716C">review outside this context (bias); relay to a session</text>

  <!-- NONE -->
  <text x="48" y="460" font-size="10" font-weight="700" fill="#16A34A" letter-spacing="0.5">NONE</text>
  <rect x="48" y="464" width="256" height="1" fill="#C9EFDA"/>

  <rect x="48" y="472" width="40" height="17" rx="4.5" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="68" y="484" font-size="9.5" font-weight="600" fill="#14532D" text-anchor="middle">auto</text>
  <text x="98" y="484" font-size="11.5" font-weight="600" fill="#1C1917">auto</text>
  <text x="48" y="502" font-size="10" fill="#78716C">fully autonomous; no human gate</text>

  <!-- HINT ONLY -->
  <text x="48" y="524" font-size="10" font-weight="700" fill="#78716C" letter-spacing="0.5">HINT ONLY  ·  demoted</text>
  <rect x="48" y="528" width="256" height="1" fill="#E7E5E4"/>

  <rect x="48" y="536" width="42" height="17" rx="4.5" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="3 2"/>
  <text x="69" y="548" font-size="9.5" font-weight="600" fill="#4B5563" text-anchor="middle">perm?</text>
  <text x="100" y="548" font-size="11.5" font-weight="600" fill="#1C1917">blocked-on-permission</text>
  <text x="48" y="566" font-size="10" fill="#78716C">noisy (hallucinated) · recedes under auto-mode</text>

  <!-- drift box -->
  <rect x="44" y="580" width="276" height="34" rx="6" fill="#FAFAFA" stroke="#9CA3AF" stroke-dasharray="3 2"/>
  <text x="52" y="596" font-size="10" fill="#57534E">↻ capability change  →  graduating kind → auto</text>
  <text x="52" y="610" font-size="10" fill="#57534E">↻ direction change  →  orphaned cards re-triage →</text>

  <!-- ===== BOARD ===== -->
  <!-- header band -->
  <rect x="360" y="112" width="848" height="44" rx="8" fill="#F5F5F4"/>
  <text x="372" y="138" font-size="9.5" font-weight="700" fill="#A8A29E" letter-spacing="0.5">DIRECTION</text>
  <text x="567" y="132" font-size="10.5" font-weight="700" fill="#44403C" text-anchor="middle">BACKLOG</text>
  <text x="567" y="146" font-size="9" fill="#A8A29E" text-anchor="middle">unknown</text>
  <text x="749" y="132" font-size="10.5" font-weight="700" fill="#44403C" text-anchor="middle">IN PROGRESS</text>
  <text x="749" y="146" font-size="9" fill="#A8A29E" text-anchor="middle">working</text>
  <text x="931" y="132" font-size="10.5" font-weight="700" fill="#44403C" text-anchor="middle">READY-FOR-REVIEW</text>
  <text x="931" y="146" font-size="9" fill="#A8A29E" text-anchor="middle">agent done, human confirms</text>
  <text x="1113" y="132" font-size="10.5" font-weight="700" fill="#44403C" text-anchor="middle">DONE</text>
  <text x="1113" y="146" font-size="9" fill="#A8A29E" text-anchor="middle">human-committed</text>

  <!-- ROW A: Harden Makro Reliability -->
  <rect x="360" y="162" width="848" height="128" rx="8" fill="#FFFFFF" stroke="#E7E5E4"/>
  <text x="372" y="190" font-size="11" font-weight="700" fill="#1C1917">Harden Makro</text>
  <text x="372" y="205" font-size="11" font-weight="700" fill="#1C1917">Reliability</text>
  <text x="372" y="222" font-size="9" fill="#16A34A">● active</text>

  <!-- A1 auto -->
  <rect x="487" y="178" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <rect x="495" y="186" width="40" height="17" rx="4.5" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="515" y="198" font-size="9.5" font-weight="600" fill="#14532D" text-anchor="middle">auto</text>
  <text x="495" y="222" font-size="11.5" font-weight="600" fill="#1C1917">wire notifier→indicator</text>

  <!-- A2 review (graduating) -->
  <rect x="669" y="178" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <rect x="677" y="186" width="49" height="17" rx="4.5" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="701.5" y="198" font-size="9.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">review</text>
  <text x="677" y="222" font-size="11.5" font-weight="600" fill="#1C1917">review send-gate logic</text>

  <!-- A3 verify (permanent) -->
  <rect x="851" y="178" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <rect x="859" y="186" width="49" height="17" rx="4.5" fill="#FED7AA" stroke="#C2410C"/>
  <text x="883.5" y="198" font-size="9.5" font-weight="600" fill="#7C2D12" text-anchor="middle">verify</text>
  <text x="859" y="222" font-size="11.5" font-weight="600" fill="#1C1917">verify app window opens</text>

  <!-- A4 irreversible (permanent, done) -->
  <rect x="1033" y="178" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <rect x="1041" y="186" width="83" height="17" rx="4.5" fill="#FED7AA" stroke="#C2410C"/>
  <text x="1082.5" y="198" font-size="9.5" font-weight="600" fill="#7C2D12" text-anchor="middle">irreversible</text>
  <text x="1041" y="222" font-size="11.5" font-weight="600" fill="#1C1917">commit &amp; push fix</text>
  <text x="1181" y="230" font-size="10" fill="#16A34A" text-anchor="end">✓ done</text>

  <!-- ROW B: Pursue Freelancing -->
  <rect x="360" y="296" width="848" height="128" rx="8" fill="#FFFFFF" stroke="#E7E5E4"/>
  <text x="372" y="324" font-size="11" font-weight="700" fill="#1C1917">Pursue</text>
  <text x="372" y="339" font-size="11" font-weight="700" fill="#1C1917">Freelancing</text>
  <text x="372" y="356" font-size="9" fill="#16A34A">● active</text>

  <!-- B1 biz-judgment (graduating) -->
  <rect x="487" y="312" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <rect x="495" y="320" width="83" height="17" rx="4.5" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="536.5" y="332" font-size="9.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">biz-judgment</text>
  <text x="495" y="356" font-size="11.5" font-weight="600" fill="#1C1917">take the $1.2k gig?</text>

  <!-- B2 physical (permanent) -->
  <rect x="669" y="312" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <rect x="677" y="320" width="60" height="17" rx="4.5" fill="#FED7AA" stroke="#C2410C"/>
  <text x="707" y="332" font-size="9.5" font-weight="600" fill="#7C2D12" text-anchor="middle">physical</text>
  <text x="677" y="356" font-size="11.5" font-weight="600" fill="#1C1917">reply to client on site</text>

  <!-- B3 verify (permanent) -->
  <rect x="851" y="312" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D6D3D1"/>
  <rect x="859" y="320" width="49" height="17" rx="4.5" fill="#FED7AA" stroke="#C2410C"/>
  <text x="883.5" y="332" font-size="9.5" font-weight="600" fill="#7C2D12" text-anchor="middle">verify</text>
  <text x="859" y="356" font-size="11.5" font-weight="600" fill="#1C1917">verify gig is listed</text>

  <!-- ROW C: Exploratory (retired) -->
  <rect x="360" y="430" width="848" height="104" rx="8" fill="#FCFCFB" stroke="#D6D3D1" stroke-dasharray="4 3"/>
  <text x="372" y="458" font-size="11" font-weight="700" fill="#A8A29E">Exploratory</text>
  <text x="372" y="473" font-size="9" fill="#9CA3AF">○ retired</text>

  <!-- C1 orphan -->
  <rect x="487" y="452" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#D6D3D1" stroke-dasharray="4 3" opacity="0.55"/>
  <rect x="495" y="460" width="83" height="17" rx="4.5" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="536.5" y="472" font-size="9.5" font-weight="600" fill="#1E3A8A" text-anchor="middle">biz-judgment</text>
  <text x="495" y="496" font-size="11.5" font-weight="600" fill="#A8A29E">research rival platforms</text>
  <rect x="595" y="460" width="46" height="14" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="618" y="470" font-size="8.5" font-weight="700" fill="#991B1B" text-anchor="middle">ORPHAN</text>

  <!-- ===== SIGNAL FLOW STRIP ===== -->
  <rect x="32" y="628" width="1176" height="212" rx="12" fill="#FFFFFF" stroke="#E7E5E4"/>
  <text x="48" y="656" font-size="14" font-weight="700" fill="#1C1917">signal flow — how a card’s indicator gets set</text>
  <text x="48" y="674" font-size="11" fill="#78716C">the agent never touches the board; makro projects its signals onto a birth-assigned kind</text>

  <!-- Node 1: Worker Agent -->
  <rect x="56" y="700" width="210" height="78" rx="10" fill="#FCFCFB" stroke="#D6D3D1"/>
  <text x="68" y="722" font-size="12" font-weight="700" fill="#1C1917">Worker Agent</text>
  <text x="68" y="740" font-size="9.5" fill="#57534E">claude · copilot · codex</text>
  <text x="68" y="755" font-size="9.5" fill="#57534E">does the work</text>
  <text x="68" y="770" font-size="9.5" fill="#57534E">emits signals</text>

  <!-- arrow 1 -->
  <line x1="266" y1="738" x2="337" y2="738" stroke="#A8A29E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="301.5" y="730" font-size="9" fill="#78716C" text-anchor="middle">signals</text>
  <text x="301.5" y="752" font-size="9" fill="#A8A29E" text-anchor="middle">notifier + structured-output</text>

  <!-- Node 2: Makro orchestrator -->
  <rect x="337" y="700" width="250" height="78" rx="10" fill="#FCFCFB" stroke="#D6D3D1"/>
  <text x="349" y="722" font-size="12" font-weight="700" fill="#1C1917">Makro orchestrator</text>
  <text x="349" y="740" font-size="9.5" fill="#57534E">kind @ birth — human picks</text>
  <text x="349" y="755" font-size="9.5" fill="#57534E">baseline human_loop ← kind</text>
  <text x="349" y="770" font-size="9.5" fill="#57534E">runtime events only escalate</text>

  <!-- arrow 2 -->
  <line x1="587" y1="738" x2="658" y2="738" stroke="#A8A29E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="622.5" y="730" font-size="9" fill="#78716C" text-anchor="middle">writes</text>

  <!-- Node 3: indicator -->
  <rect x="658" y="700" width="230" height="78" rx="10" fill="#FCFCFB" stroke="#D6D3D1"/>
  <text x="670" y="722" font-size="12" font-weight="700" fill="#1C1917">indicator · human_loop</text>
  <text x="670" y="740" font-size="9.5" fill="#57534E">value: required | optional |</text>
  <text x="670" y="755" font-size="9.5" fill="#57534E">       none | unknown</text>
  <text x="670" y="770" font-size="9.5" fill="#57534E">+ reason + assessed_at</text>

  <!-- arrow 3 -->
  <line x1="888" y1="738" x2="959" y2="738" stroke="#A8A29E" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="923.5" y="730" font-size="9" fill="#78716C" text-anchor="middle">renders</text>

  <!-- Node 4: Card -->
  <rect x="959" y="700" width="210" height="78" rx="10" fill="#FCFCFB" stroke="#D6D3D1"/>
  <text x="971" y="722" font-size="12" font-weight="700" fill="#1C1917">Card on board</text>
  <text x="971" y="740" font-size="9.5" fill="#57534E">grouped by direction (why)</text>
  <text x="971" y="755" font-size="9.5" fill="#57534E">badged by kind (how)</text>
  <text x="971" y="770" font-size="9.5" fill="#57534E">column = state (where)</text>

  <!-- footer note -->
  <text x="624" y="812" font-size="10.5" fill="#78716C" text-anchor="middle">blocked-on-permission is a hint, not a trigger  ·  “done” is human-committed, never auto  ·  capability change graduates a kind; direction change orphans its cards</text>
</svg>
